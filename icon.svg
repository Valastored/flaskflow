<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2b2f6b"/>
      <stop offset="1" stop-color="#5b2391"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.62" cy="0.62" r="0.5">
      <stop offset="0" stop-color="#ffd23f" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#ffd23f" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <rect width="512" height="512" fill="url(#glow)"/>
<g transform="translate(256,262) scale(0.8) translate(-222,-222)">
  <defs>
    <clipPath id="tubeclip"><path d="M-48,0 H48 V202 A48,48 0 0 1 -48,202 Z"/></clipPath>
  </defs>
  <!-- stream from the tilted tube into the upright one -->
  <path d="M292,150 C318,162 330,190 330,236" stroke="#2ec4b6" stroke-width="22"
        fill="none" stroke-linecap="round"/>
  <!-- upright tube (receiving) -->
  <g transform="translate(330,190)">
    <path d="M-48,0 H48 V202 A48,48 0 0 1 -48,202 Z" fill="#ffffff" fill-opacity="0.14"/>
    <g clip-path="url(#tubeclip)">
      <rect x="-48" y="186" width="96" height="70" fill="#2d6cdf"/>
      <rect x="-48" y="128" width="96" height="58" fill="#ffd23f" opacity="1"/>
      <rect x="-48" y="70"  width="96" height="58" fill="#e63946" opacity="1"/>
      <rect x="-48" y="44"  width="96" height="26" fill="#2ec4b6" opacity="1"/>
      <rect x="16" y="44" width="20" height="212" fill="#000000" fill-opacity="0.14"/>
    </g>
    <path d="M-48,0 H48 V202 A48,48 0 0 1 -48,202 Z" fill="none" stroke="#ffffff" stroke-width="12" stroke-linejoin="round"/>
    <rect x="-30" y="22" width="9" height="120" rx="4" fill="#ffffff" fill-opacity="0.35"/>
  </g>
  <!-- tilted tube (pouring) -->
  <g transform="translate(286,148) rotate(122)">
    <path d="M-48,0 H48 V202 A48,48 0 0 1 -48,202 Z" fill="#ffffff" fill-opacity="0.14"/>
    <g clip-path="url(#tubeclip)">
      <rect x="-48" y="120" width="96" height="140" fill="#2ec4b6" opacity="1"/>
    </g>
    <path d="M-48,0 H48 V202 A48,48 0 0 1 -48,202 Z" fill="none" stroke="#ffffff" stroke-width="12" stroke-linejoin="round"/>
  </g>
  <!-- sparkles -->
  <g fill="#ffd23f">
    <path d="M118,360 l10,24 24,10 -24,10 -10,24 -10,-24 -24,-10 24,-10z"/>
    <path d="M196,420 l6,14 14,6 -14,6 -6,14 -6,-14 -14,-6 14,-6z"/>
  </g>
</g></svg>